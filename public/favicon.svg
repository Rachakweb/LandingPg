<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1422" />
      <stop offset="100%" stop-color="#05070c" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="45%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />

  <!-- Subtle Inner Border -->
  <rect x="6" y="6" width="52" height="52" rx="12" fill="none" stroke="rgba(245, 158, 11, 0.2)" stroke-width="1" />

  <!-- Stylized Geometric Monogram X -->
  <path d="M19 18 L26.5 18 L32 26.5 L37.5 18 L45 18 L36 32 L46 46 L38.5 46 L32 36.5 L25.5 46 L18 46 L27.5 32 Z" 
        fill="url(#goldGrad)" 
        filter="url(#goldGlow)" />

  <!-- Active Emerald Alpha Pulse -->
  <circle cx="47" cy="17" r="3.5" fill="#10b981" stroke="#05070c" stroke-width="1.5" />
</svg>
